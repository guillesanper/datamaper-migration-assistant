# Configuración de GitGuardian (ggshield).
# Formato: https://docs.gitguardian.com/ggshield-docs/configuration
version: 2

secret:
  # Valores falsos de los tests de backend/test/. Se ignora cada valor concreto, no la carpeta
  # entera: una credencial real que se suba a los tests seguiría detectándose.
  # ggshield descarta un hallazgo si alguna de sus coincidencias es igual a uno de estos valores,
  # así que solo deben ir valores que nunca puedan formar parte de una credencial real.
  # No se incluye "postgres" (password por defecto de la BD de test local): también es un
  # usuario habitual y ocultaría un hallazgo real como postgres://postgres:<password>@host.
  ignored_matches:
    - name: 'test: password de las configs de conexión de ejemplo'
      match: tiger
    - name: 'test: contraseña de usuario'
      match: Str0ng!Passw0rd
    - name: 'test: contraseña nueva'
      match: N3w!Str0ngPassw0rd
    - name: 'test: clave maestra, base64 de "datamap-test-master-key-32-bytes"'
      match: ZGF0YW1hcC10ZXN0LW1hc3Rlci1rZXktMzItYnl0ZXM=
