# NOTA: este fichero vive en backend/, no en la raíz del repo. Al crear el Blueprint en
# Render hay que indicar "Blueprint Path" = backend/render.yaml (por defecto Render busca
# render.yaml en la raíz). Los servicios frontend/landing usan rutas desde la raíz del repo
# y el backend usa rootDir: backend.
#
# SECRETOS: este fichero NO contiene valores sensibles.
#   - sync: false      -> Render pide el valor en el panel al crear el Blueprint
#   - generateValue    -> Render genera un valor aleatorio (base64, 256 bits) una sola vez
services:
  - type: web
    name: datamap-backend
    runtime: python
    rootDir: backend  # buildCommand/startCommand se ejecutan desde backend/ (donde está alembic.ini)
    buildCommand: pip install -r requirements.txt
    # Aplica las migraciones y arranca gunicorn; si alembic falla (&&) el servicio no arranca.
    # Workers/timeout/reciclado salen de las variables definidas más abajo. Sin --reload (solo desarrollo).
    startCommand: alembic upgrade head && gunicorn main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --workers $WEB_CONCURRENCY --timeout $GUNICORN_TIMEOUT --max-requests $GUNICORN_MAX_REQUESTS
    healthCheckPath: /health
    envVars:
      # === CONFIGURACIÓN GENERAL ===
      - key: ENV
        value: production
      - key: PYTHON_VERSION  # Render usa por defecto una versión más nueva; el proyecto se prueba con 3.11
        value: "3.11.17"
      - key: SECRET_KEY
        generateValue: true
      - key: BASE_URL  # URL pública que usa Stripe para success/cancel (rellenar en el panel)
        sync: false

      # === BASE DE DATOS POSTGRESQL ===
      # Leídas por app/database/session.py y alembic/env.py. Se rellenan en el panel
      # (BD externa); si se define un recurso `databases:` en este blueprint, usar fromDatabase.
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: datamap
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false

      # === STRIPE CONFIGURACIÓN ===
      # (STRIPE_PUBLISHABLE_KEY no la lee el backend, se retira)
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID_MONTHLY
        sync: false

      # === CONFIGURACIÓN SMTP ===
      - key: EMAIL_FROM
        value: alerts@sesecpro.es
      - key: SMTP_SERVER
        value: smtp.protonmail.ch
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false

      # === CONFIGURACIÓN CSRF ===
      - key: CSRF_SECRET_KEY
        generateValue: true
      - key: CSRF_TOKEN_EXPIRY
        value: "3600"
      - key: DISABLE_CSRF_IN_DEV
        value: "false"  # Mantener CSRF habilitado en producción

      # === CONFIGURACIÓN DE SEGURIDAD ===
      - key: HASH_IP_ADDRESSES
        value: "true"
      - key: IP_HASH_SALT
        generateValue: true

      # === REDIS - ENCRYPTION SESSION CACHE ===
      # REDIS_URL la lee app/utils/redis_client.py (con redis:// no hace falta REDIS_SSL;
      # el TLS se decide por el esquema rediss://). REDIS_HOST/REDIS_PORT los lee solo
      # app/routers/db_connections.py, que no usa REDIS_URL.
      - key: REDIS_URL
        fromService:
          type: redis
          name: datamap-redis
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: redis
          name: datamap-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: datamap-redis
          property: port

      # === ENCRYPTION SESSION CONFIGURATION ===
      - key: ENCRYPTION_ENABLED
        value: "true"
      - key: ENCRYPTION_MASTER_KEY  # 32 bytes en base64 (p. ej. `openssl rand -base64 32`); guardar copia: sin ella no se descifran las credenciales guardadas
        sync: false
      - key: ENCRYPTION_SESSION_TIMEOUT
        value: "10800"  # 3 horas
      - key: ARGON2_MEMORY_COST
        value: "65536"  # 64 MiB
      - key: ARGON2_TIME_COST
        value: "3"
      - key: ARGON2_PARALLELISM
        value: "1"

      # === GUNICORN CONFIGURATION ===
      - key: WEB_CONCURRENCY
        value: "2"  # Workers (--workers en startCommand)
      - key: GUNICORN_TIMEOUT
        value: "120"
      - key: GUNICORN_MAX_REQUESTS
        value: "1000"

  # === FRONTEND (React + Vite) ===
  - type: web
    name: datamap-frontend
    env: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: VITE_API_URL
        value: https://datamap-backend.onrender.com  # Ajustar a tu URL real del backend

  # === LANDING PAGE (Astro) ===
  - type: web
    name: datamap-landing
    env: static
    buildCommand: cd landing && npm ci && npm run build
    staticPublishPath: landing/dist
    envVars:
      - key: NODE_VERSION
        value: 20

  # Redis interno (Render.com)
  - type: redis
    name: datamap-redis
    plan: starter  # $7/mes - 25MB RAM, 10 conexiones
    maxmemoryPolicy: allkeys-lru  # Evict least recently used keys when memory limit reached
    ipAllowList: []  # Vacío = solo conexiones internas (más seguro)