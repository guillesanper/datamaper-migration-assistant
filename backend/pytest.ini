# pytest.ini
[pytest]
testpaths = test
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --tb=short
    --maxfail=5
    # Optimizaciones de rendimiento
    --import-mode=importlib
    # Mostrar los tests más lentos para identificar problemas
    --durations=10
    # Reordenar tests para ejecutar los que fallan primero
    --ff
    # Por defecto, excluir tests marcados como 'slow' (timeout tests, etc)
    # Para ejecutar TODOS los tests incluyendo lentos: pytest -m ""
    -m "not slow"
    # NOTA: Para ejecutar tests en paralelo, usa: pytest -n auto
    # Esto ejecutará tests en múltiples CPUs usando pytest-xdist

markers =
    unit: Tests unitarios
    integration: Tests de integración
    e2e: Tests end-to-end
    slow: Tests lentos
    security: Tests de seguridad
    encryption: Tests de cifrado
    auth: Tests de autenticación
    database: Tests que requieren base de datos

asyncio_mode = auto

# Filtrar warnings de deprecación de Pydantic V2
filterwarnings =
    ignore::DeprecationWarning:pydantic.*
    ignore::UserWarning:pydantic.*

# Configuración de timeout por defecto para evitar tests colgados
# timeout = 30

# Configuración de logging para reducir output
log_cli = false
log_cli_level = WARNING

# Configuración para pytest-xdist (ejecución en paralelo)
# Usar --dist=loadscope para agrupar tests del mismo archivo/clase en el mismo worker
# Esto reduce race conditions en fixtures compartidos
# --dist=loadfile: agrupar por archivo (más rápido pero menos paralelismo)
# --dist=loadscope: agrupar por scope (balance entre velocidad y paralelismo)
# --dist=load: distribución dinámica (máximo paralelismo pero más race conditions)
