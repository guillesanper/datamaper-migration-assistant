name: E2E Tests

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  workflow_dispatch:  # Allow manual trigger

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Start test databases (PostgreSQL:5433, MySQL:3307, Redis:6380)
        run: docker compose -f docker-compose.test.yml up -d

      - name: Wait for test databases to be healthy
        run: |
          echo "Waiting for PostgreSQL test instance (port 5433)..."
          timeout 60 bash -c 'until docker exec datamap-postgres-test pg_isready -U test_user -d test_database 2>/dev/null; do sleep 2; done'
          echo "Waiting for MySQL test instance (port 3307)..."
          timeout 60 bash -c 'until docker exec datamap-mysql-test mysqladmin ping -h localhost -u test_user -ptest_password 2>/dev/null; do sleep 2; done'
          echo "Waiting for Redis test instance (port 6380)..."
          timeout 60 bash -c 'until docker exec datamap-redis-test redis-cli ping 2>/dev/null; do sleep 2; done'
          echo "All test databases are ready!"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run E2E tests
        working-directory: backend
        env:
          # PostgreSQL test database
          DB_HOST: localhost
          DB_PORT: 5433
          DB_NAME: test_database
          DB_USER: test_user
          DB_PASSWORD: test_password
          # El conftest toma la BD de la app de TEST_DB_* (sin ellas usaría postgres/postgres)
          TEST_DB_HOST: localhost
          TEST_DB_PORT: 5433
          TEST_DB_USER: test_user
          TEST_DB_PASSWORD: test_password

          # Redis test instance
          REDIS_HOST: localhost
          REDIS_PORT: 6380
          REDIS_PASSWORD: ""
          REDIS_DB: 0
          REDIS_SSL: "false"

          # App configuration
          SECRET_KEY: test-secret-key-for-e2e-ci
          # Los tests asumen desarrollo, como en pr-checks.yml ("test" se trata como producción)
          ENV: development
          ENCRYPTION_ENABLED: "false"
          # docker-compose.test.yml está levantado: no omitir los tests de MySQL/PostgreSQL externos
          REQUIRE_TEST_DATABASES: "1"
        run: |
          pytest -m e2e -v --tb=long --maxfail=3

      - name: Capture service logs on failure
        if: failure()
        run: |
          echo "=== Docker Compose Logs ==="
          docker compose -f docker-compose.test.yml logs > e2e-logs.txt
          cat e2e-logs.txt

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: e2e-logs.txt
          retention-days: 7

      - name: Cleanup services
        if: always()
        run: |
          docker compose -f docker-compose.test.yml down -v
