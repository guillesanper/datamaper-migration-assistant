version: 2
updates:
  # Backend Python dependencies
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 1
    reviewers:
      - "guillermo"  # Reemplazar con tu username de GitHub
    # Dependabot lee todos los requirements*.txt del directorio, también requirements-dev.txt.
    # Las herramientas de lint/tipos van en su propio grupo: un bump de black o mypy puede
    # cambiar los resultados del CI y conviene revisarlo aparte de las dependencias de la app.
    # Al aceptar uno, actualizar también las revs de .pre-commit-config.yaml.
    groups:
      backend-dev-tools:
        patterns:
          - "black"
          - "isort"
          - "flake8"
          - "mypy"
          - "types-*"
      backend-python:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "backend"
    commit-message:
      prefix: "chore(deps-backend)"

  # Frontend npm dependencies
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 1
    reviewers:
      - "guillermo"  # Reemplazar con tu username de GitHub
    groups:
      frontend-npm:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "chore(deps-frontend)"

  # Landing page npm dependencies
  - package-ecosystem: "npm"
    directory: "/landing"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 1
    reviewers:
      - "guillermo"  # Reemplazar con tu username de GitHub
    groups:
      landing-npm:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "landing"
    commit-message:
      prefix: "chore(deps-landing)"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(deps-ci)"
