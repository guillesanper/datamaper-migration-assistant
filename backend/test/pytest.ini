# pytest.ini
[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    -n auto
    --dist=loadfile
    --strict-markers
    --tb=short

markers =
    unit: Tests unitarios
    integration: Tests de integración
    e2e: Tests end-to-end
    slow: Tests lentos
    security: Tests de seguridad
    encryption: Tests de cifrado
    auth: Tests de autenticación
    database: Tests que requieren base de datos
    db_connections: Tests relacionados con conexiones a bases de datos

asyncio_mode = auto
